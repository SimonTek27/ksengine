# kssimserver startup configuration
#
# Read by kssimserver.exe from server/kssimserver.ini relative to the working
# directory, i.e. next to the executable in an installed tree
# (cmake/KsInstallLayout.cmake). Command line flags always win over this file;
# pass --config <path> to read a different one.
#
# Syntax: one "key = value" per line. Blank lines and lines starting with
# ';' or '#' are ignored. Unknown keys are reported and ignored.

# Host name announced to LAN discovery (also the default --name).
name = ksengine-server

# Advertise this host on LAN discovery on start-up (--announce).
announce = false

# Track folder loaded at start-up, relative to the working directory
# (--track). Leave empty to start with no track loaded.
track =

# Number of AI cars placed on the grid (--ai), 0..32.
ai = 0

# UDP port the game network listens on (--game-port), 1024..65535.
# 0 disables the game network entirely and only discovery/control run.
game-port = 0

# Seats offered by this host (--max-clients). Used for the announced
# players/maxPlayers pair and for the game network session.
max-clients = 24

# LAN discovery (UDP) port. Clients must use the same port to find this host.
discovery-port = 20779

# External control API (TCP) port.
control-port = 20780
